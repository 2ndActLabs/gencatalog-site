name: Download and checkout privacy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check analytics.js
      - run: node scripts/test-download-privacy.mjs
      - run: node scripts/test-html-validator.mjs
